name: DevSecOps "Plug & Play" Pipeline

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:
    inputs:
      secret_tool:
        description: 'Secret Tool (e.g., gitleaks)'
        default: 'gitleaks'
        type: string
      sast_tool:
        description: 'SAST Tool (e.g., semgrep)'
        default: 'semgrep'
        type: string
      dependency_tool:
        description: 'SCA Tool (e.g., trivy)'
        default: 'trivy'
        type: string
      run_soc2:
        description: 'Run SOC2 Scan?'
        type: boolean
        default: true
      run_hipaa:
        description: 'Run HIPAA Scan?'
        type: boolean
        default: true

permissions:
  contents: write
  security-events: write

jobs:
  # ============================================================
  # GLOBAL SCANNER JOB
  # Dynamically calls wrappers based on input
  # ============================================================
  security-scans:
    name: " Security Toolbox - Execution"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name:  Run Secret Scan
        env:
          TOOL: ${{ github.event.inputs.secret_tool || 'gitleaks' }}
        run: |
          chmod +x tools/secrets/$TOOL.sh
          ./tools/secrets/$TOOL.sh

      - name:  Run SAST Scan
        env:
          TOOL: ${{ github.event.inputs.sast_tool || 'semgrep' }}
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          chmod +x tools/sast/$TOOL.sh
          ./tools/sast/$TOOL.sh

      - name:  Run Dependency Scan
        env:
          TOOL: ${{ github.event.inputs.dependency_tool || 'trivy' }}
        run: |
          chmod +x tools/dependency/$TOOL.sh
          ./tools/dependency/$TOOL.sh

      - name:  Run SOC2 Compliance
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.run_soc2 == 'true'
        run: |
          chmod +x tools/compliance/soc2.sh
          ./tools/compliance/soc2.sh

      - name:  Run HIPAA Compliance
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.run_hipaa == 'true'
        run: |
          chmod +x tools/compliance/hipaa.sh
          ./tools/compliance/hipaa.sh

      - name:  Claude Code Security Scan
        if: github.base_ref == 'master'
        run: |
          chmod +x tools/sast/claude.sh
          ./tools/sast/claude.sh

      - name: Upload all reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-scan-reports
          path: |
            gitleaks-report.json
            semgrep-report.json
            dependency-report.json
            soc2-report.json
            hipaa-report.json
            claude-report.json

  # ============================================================
  # NORMALIZE & DEPLOY
  # ============================================================
  normalize:
    name: " Normalize & Dashboard"
    runs-on: ubuntu-latest
    needs: [security-scans]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all scan artifacts
        uses: actions/download-artifact@v4
        with:
          name: all-scan-reports
          path: .
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Merge reports into final security report
        run: python scripts/normalize.py

      - name: Upload final unified report
        uses: actions/upload-artifact@v4
        with:
          name: final-security-report
          path: final-security-report.json

      - name: Prepare Dashboard Deployment
        run: cp final-security-report.json ui/final-security-report.json

      - name: Deploy Dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./ui
          keep_files: false
          commit_message: "docs(dashboard): build universal unified security dashboard [skip ci]"
