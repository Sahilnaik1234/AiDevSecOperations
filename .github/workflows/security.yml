name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

permissions:
  contents: read
  security-events: write

jobs:
  # ============================================================
  # JOB 1: SECRET SCANNING — Gitleaks
  # Scans full git history for exposed secrets/credentials
  # Runs in parallel with sast and dependency-scan
  # ============================================================
  secret-scan:
    name: "🔑 Secret Scan (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # Full history so Gitleaks scans every commit

      - name: Run Gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source=. --report-format=json --report-path=gitleaks-report.json --exit-code=1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}   # Only needed for orgs; leave secret unset for public repos
        continue-on-error: false   # ← CI BREAKS if secrets are found

      - name: Upload Gitleaks report
        if: always()               # Upload even if the step fails so we have evidence
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn

  # ============================================================
  # JOB 2: STATIC APPLICATION SECURITY TESTING — Semgrep
  # Language-agnostic SAST — auto-detects Python, JS/TS, Java,
  # Go, C/C++, C#, Ruby, PHP, Kotlin, Rust, Terraform, Docker
  # Runs in parallel with secret-scan and dependency-scan
  # ============================================================
  sast:
    name: "🔍 SAST (Semgrep)"
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        run: |
          semgrep \
            --config=auto \
            --json \
            --output=semgrep-report.json \
            --severity=WARNING \
            --severity=ERROR \
            --error \
            .
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}   # Optional — enables Semgrep Cloud dashboard
        continue-on-error: false   # ← CI BREAKS if vulnerabilities are found

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json
          if-no-files-found: warn

  # ============================================================
  # JOB 3: DEPENDENCY SCAN — pip-audit (Inline SCA)
  # Synchronously scans requirements.txt for CVEs in real-time,
  # breaking the CI process if known vulnerabilities are found.
  # Much faster and more reliable in CI than waiting for the 
  # async Dependabot REST API.
  # Runs in parallel with secret-scan and sast
  # ============================================================
  dependency-scan:
    name: "📦 Dependency Scan (pip-audit)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run inline dependency scan (pip-audit)
        id: dep_check
        run: |
          echo "Scanning requirements.txt for CVEs..."
          # Run audit and export JSON; exit code 1 if vulns found
          pip-audit -r requirements.txt -f json -o dependency-report.json || true
          
          # Check if the report has vulns and break CI if true
          VULNS=$(python -c '
          import json, sys
          try:
            data = json.load(open("dependency-report.json"))
            vuln_count = sum(1 for pkg in data.get("dependencies", []) if pkg.get("vulns"))
            print(vuln_count)
          except:
            print(0)
          ')
          
          echo "Packages with vulnerabilities: $VULNS"
          
          if [ "$VULNS" -gt 0 ]; then
            echo "❌ $VULNS vulnerable packages found inline. CI failing."
            exit 1
          fi

      - name: Upload Dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: dependency-report.json
          if-no-files-found: warn

  # ============================================================
  # JOB 4: NORMALIZE & SUMMARIZE
  # Downloads all three artifacts and merges them into one
  # unified final-security-report.json
  # Only runs after ALL three parallel scans complete
  # ============================================================
  normalize:
    name: "📊 Normalize & Summarize Report"
    runs-on: ubuntu-latest
    needs: [secret-scan, sast, dependency-scan]   # Waits for all 3 parallel jobs
    if: always()                                    # Run even if a scan job fails, so we get a report
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all scan artifacts
        uses: actions/download-artifact@v4
        with:
          path: scan-reports
        continue-on-error: true    # If a scan job failed, its artifact may not exist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Merge reports into final security report
        run: python scripts/normalize.py

      - name: Print summary to job log
        run: |
          echo "===== SECURITY REPORT SUMMARY ====="
          python3 -c "
          import json
          with open('final-security-report.json') as f:
              report = json.load(f)
          summary = report.get('summary', {})
          print(f\"Total findings : {summary.get('total_findings', 0)}\")
          print(f\"Gitleaks (secrets) : {summary.get('gitleaks', 0)}\")
          print(f\"Semgrep (SAST)     : {summary.get('semgrep', 0)}\")
          print(f\"Dependabot (deps)  : {summary.get('dependabot', 0)}\")
          "

      - name: Upload final unified report
        uses: actions/upload-artifact@v4
        with:
          name: final-security-report
          path: final-security-report.json
