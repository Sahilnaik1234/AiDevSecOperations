name: DevSecOps Security Pipeline

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

permissions:
  contents: write
  security-events: write

jobs:
  # ============================================================
  # JOB 1: SECRET SCANNING — Gitleaks
  # Scans full git history for exposed secrets/credentials
  # Runs in parallel with sast and dependency-scan
  # ============================================================
  secret-scan:
    name: "Secret Scan (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Gitleaks via pure Docker
        id: gitleaks
        run: |
          # Use docker manually because the gitleaks container lacks bash,
          # which standard GitHub Actions container directives require.
          # -v mounts the checked-out code into the container at /src
          docker run --rm -v ${{ github.workspace }}:/src zricethezav/gitleaks:latest detect --no-git --source=/src --report-format=json --report-path=/src/gitleaks-report.json --exit-code=1
        continue-on-error: false   # ← CI BREAKS if secrets are found

      - name: Upload Gitleaks report
        if: always()               # Upload even if the step fails so we have evidence
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn

  # ============================================================
  # JOB 2: STATIC APPLICATION SECURITY TESTING — Semgrep
  # Language-agnostic SAST — auto-detects Python, JS/TS, Java,
  # Go, C/C++, C#, Ruby, PHP, Kotlin, Rust, Terraform, Docker
  # Runs in parallel with secret-scan and dependency-scan
  # ============================================================
  sast:
    name: "SAST (Semgrep)"
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        run: |
          semgrep \
            --config=auto \
            --json \
            --output=semgrep-report.json \
            --severity=WARNING \
            --severity=ERROR \
            --error \
            .
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: false

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json
          if-no-files-found: warn

  # ============================================================
  # JOB 3: DEPENDENCY SCAN — Trivy (Inline universal SCA)
  # Synchronously scans all lockfiles (requirements.txt, package.json,
  # pom.xml, go.mod, etc.) for CVEs in real-time.
  # Breaks the CI process if HIGH/CRITICAL vulnerabilities are found.
  # Runs in parallel with secret-scan and sast
  # ============================================================
  dependency-scan:
    name: "📦 Dependency Scan (Trivy)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          format: 'json'
          output: 'dependency-report.json'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
        continue-on-error: false

      - name: Upload Dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: dependency-report.json
          if-no-files-found: warn

  # ============================================================
  # JOB 4: HIPAA COMPLIANCE SCAN — Semgrep
  # Specifically targets HIPAA Privacy and Security rules
  # Runs in parallel with other scans
  # ============================================================
  hipaa-scan:
    name: "⚖️ HIPAA Compliance (Semgrep)"
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Targeted HIPAA Compliance Scan
        run: |
          # Use our custom local HIPAA ruleset for high-confidence detection
          semgrep \
            --config=.semgrep-hipaa.yml \
            --json \
            --output=hipaa-report.json \
            .
        continue-on-error: true

      - name: Debug - Verify Report Generation
        run: |
          if [ -f hipaa-report.json ]; then
            echo "SUCCESS: hipaa-report.json generated."
            ls -lh hipaa-report.json
            echo "--- Preview (First 500 chars) ---"
            head -c 500 hipaa-report.json
          else
            echo "FAIL: hipaa-report.json NOT FOUND"
            exit 1
          fi

      - name: Upload HIPAA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hipaa-report
          path: hipaa-report.json

  # ============================================================
  # JOB 5: INFRA COMPLIANCE SCAN — Checkov
  # Scans Dockerfiles and configs for HIPAA best practices
  # ============================================================
  compliance-scan:
    name: "🏥 Infra Compliance (Checkov)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: .
          framework: all
          output_format: json
          output_file_path: compliance-report.json
          quiet: true
        continue-on-error: true

      - name: Upload Compliance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-report
          path: compliance-report.json

  # ============================================================
  # JOB 6: NORMALIZE & SUMMARIZE
  # Merges all findings into one unified report
  # ============================================================
  normalize:
    name: " Normalize & Summarize Report"
    runs-on: ubuntu-latest
    needs: [secret-scan, sast, dependency-scan, hipaa-scan, compliance-scan]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all scan artifacts
        uses: actions/download-artifact@v4
        with:
          path: scan-reports
        continue-on-error: true    # If a scan job failed, its artifact may not exist

      - name: Debug Artifact Directory Structure
        run: ls -R scan-reports

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Merge reports into final security report
        run: python scripts/normalize.py

      - name: Print summary to job log
        run: |
          echo "===== SECURITY REPORT SUMMARY ====="
          python3 -c "
          import json, os
          path = 'final-security-report.json'
          if os.path.exists(path):
              with open(path) as f:
                  report = json.load(f)
              summary = report.get('summary', {})
              print(f\"Total findings : {summary.get('total_findings', 0)}\")
              print(f\"Secrets (Gitleaks) : {summary.get('gitleaks', 0)}\")
              print(f\"SAST (Semgrep)     : {summary.get('semgrep', 0)}\")
              print(f\"SCA (Dependencies) : {summary.get('dependency', 0)}\")
              print(f\"Compliance (HIPAA) : {summary.get('compliance', 0)}\")
          else:
              print('Error: final-security-report.json not generated.')
          "

      - name: Upload final unified report
        uses: actions/upload-artifact@v4
        with:
          name: final-security-report
          path: final-security-report.json

      - name: Prepare Dashboard Deployment
        run: cp final-security-report.json ui/final-security-report.json

      - name: Deploy Dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./ui
          keep_files: false
          commit_message: "docs(dashboard): build universal unified security dashboard [skip ci]"
