# .gitleaks.toml — Gitleaks configuration
# Docs: https://github.com/gitleaks/gitleaks#configuration

title = "AiDevSecOperations Gitleaks Config"

# ─────────────────────────────────────────
# ALLOWLIST — paths/files to never scan
# (e.g. test fixtures, generated files, lockfiles)
# ─────────────────────────────────────────
[allowlist]
description = "Global allowlist"
paths = [
    # Dependency lockfiles (often contain hash-like strings that look like secrets)
    "(.*?)package-lock\\.json",
    "(.*?)yarn\\.lock",
    "(.*?)poetry\\.lock",
    "(.*?)Pipfile\\.lock",
    "(.*?)Cargo\\.lock",
    # Build output
    "(.*?)dist/",
    "(.*?)build/",
    "(.*?)__pycache__/",
    # This file itself
    "\\.gitleaks\\.toml",
]

# ─────────────────────────────────────────
# EXTEND DEFAULT RULES
# ─────────────────────────────────────────

# Custom rule: catch generic API keys in any language
[[rules]]
id          = "generic-api-key"
description = "Generic API key pattern"
regex       = '''(?i)(api[_\-\s]?key|apikey)\s*[:=]\s*['"]?([A-Za-z0-9\-_]{20,})['"]?'''
tags        = ["api-key", "secret"]
severity    = "HIGH"

# Custom rule: catch JWT secrets in config files
[[rules]]
id          = "jwt-secret"
description = "JWT secret key"
regex       = '''(?i)(jwt[_\-\s]?secret|JWT_SECRET)\s*[:=]\s*['"]?([A-Za-z0-9\-_+/]{16,})['"]?'''
tags        = ["jwt", "secret"]
severity    = "CRITICAL"

# Custom rule: DB connection strings
[[rules]]
id          = "db-connection-string"
description = "Database connection string with credentials"
regex       = '''(?i)(mongodb|postgresql|mysql|mssql):\/\/[^:]+:[^@]+@'''
tags        = ["database", "credentials"]
severity    = "CRITICAL"
