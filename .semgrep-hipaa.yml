rules:
  - id: hipaa-phi-logging-violation
    patterns:
      - pattern-either:
          - pattern: |
              logger.$METHOD(..., f"..., $PHI, ...", ...)
          - pattern: |
              logger.$METHOD(..., $PHI, ...)
      - metavariable-regex:
          metavariable: $PHI
          regex: (?i)(ssn|history|patient|medical|medical_history|phi)
    message: "HIPAA Violation: Protected Health Information (PHI) found in logging. HIPAA Technical Safeguards prohibit logging sensitive health data in cleartext."
    languages: [python, javascript]
    severity: ERROR

  - id: hipaa-insecure-http-transmission
    patterns:
      - pattern-either:
          - pattern: requests.$METHOD("http://...", ...)
          - pattern: http.get("http://...", ...)
          - pattern: axios.get("http://...", ...)
    message: "HIPAA Violation: Sensitive health data transmitted via insecure HTTP. HIPAA requires encryption in transit (HTTPS) for all PHI."
    languages: [python, javascript]
    severity: ERROR

  - id: hipaa-unencrypted-phi-storage
    patterns:
      - pattern-either:
          - pattern: |
              with open($PATH, "a") as f:
                  f.write(...)
          - pattern: |
              fs.appendFileSync($PATH, ...)
      - metavariable-regex:
          metavariable: $PATH
          regex: (?i).*patient_data.*
    message: "HIPAA Violation: Unencrypted storage of PHI in file $PATH. HIPAA requires encryption at rest for sensitive health records."
    languages: [python, javascript]
    severity: ERROR

  - id: hipaa-critical-eval-phi-violation
    patterns:
      - pattern: eval($INPUT)
      - focus-metavariable: $INPUT
    message: "HIPAA CRITICAL VIOLATION: Execution of untrusted code on HIPAA PHI data via eval(). This fails fundamental technical safeguards."
    languages: [python, javascript]
    severity: ERROR
